# shared-claude-skills kit-manifest (ST5 — DRAFT)
#
# This manifest is the TRIAGE result for the ~91 source skills under
# ~/.claude/skills/. For each source skill, it records:
#
#   - decision: keep | remove
#   - reason:   why this decision was made (kept because generic /
#              scrubbable / rewritable; removed because instance-only or
#              personal-domain)
#   - rewrite_level:
#                 trivial = body is mostly generic, minor sanitization only
#                 scrub   = significant lab-ref removal needed
#                 rewrite = body needs templating or placeholder substitution
#   - target_path: where the converted skill lands in the kit
#   - placeholders: list of placeholder categories the rewritten skill
#              will require (referenced from CONFIGURATION.md)
#
# The manifest is the contract between the triage review and the
# mass-conversion step. Mass conversion only runs after this manifest
# is approved.
#
# Re-run the triage via `scripts/build.py triage` (or by hand) — any
# change to a keep/remove decision MUST update this file before the
# corresponding skill is converted.

