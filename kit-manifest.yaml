# -----------------------------------------------------------------------------
# Triage pipeline notes
# -----------------------------------------------------------------------------

# All triage decisions were made on the following criteria:
#
# 1. GENERIC = the skill teaches a transferable craft (a methodology, a
#    technique, a domain pattern). Skills that document lab
#    infrastructure are NOT generic.
# 2. SCRUB = the lab references can be removed with regex-driven
#    pattern replacement (hostnames, paths, IPs, names).
# 3. REWRITE = the body needs placeholder substitution because the
#    references ARE the skill's content (paths, hardware counts).
# 4. REMOVE = the skill is either instance-only (couples to one
#    project's infrastructure), personal-domain (US tax, Monero, solar,
#    resume, STR), or vendor lock-in (Claude Code-specific plumbing).
#
# Mass conversion runs after this manifest is approved. Conversion
# pipeline: scripts/sanitize.py (generic patterns + user-supplied
# deny file via FACT_PACKS_DENY_FILE) -> scripts/build.py (apply
# placeholders from CONFIGURATION.md, write skill to target_path).
